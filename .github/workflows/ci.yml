name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint + Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install ruff black mypy pydantic pydantic-settings types-redis

      - name: Ruff lint
        run: ruff check app tests

      - name: Black format check
        run: black --check app tests

      - name: Mypy type check
        run: mypy app --ignore-missing-imports --no-error-summary

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          APP_ENV: development
          VALID_API_KEYS: test-key
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autoinsight_test
          OPENAI_API_KEY: sk-test
          ANTHROPIC_API_KEY: sk-ant-test
        run: pytest tests/unit -v --tb=short --cov=app --cov-report=term-missing

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t autoinsight:ci .
